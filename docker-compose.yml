services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    env_file:
      - .env
    environment:
      APP_ENV: production
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in .env}
      ADMIN_USER: ${ADMIN_USER:?Set ADMIN_USER in .env}
      ADMIN_PASS: ${ADMIN_PASS:?Set ADMIN_PASS in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:5001/readyz", timeout=4)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
