{% extends "base.html" %}
{% block title %}FotMob Stats - Home{% endblock %}
{% block content %}
<div class="home-wrapper">
    <div class="home-card glass">
        <h1><i class="fas fa-futbol"></i> FotMob Stats</h1>
        <p>Explore standings, top scorers & assists from Europe's top 5 leagues</p>
        <form id="homeForm" method="GET">
            <div class="league-grid">
                {% for key, val in leagues.items() %}
                <label class="league-btn" data-key="{{ key }}">
                    <img src="https://images.fotmob.com/image_resources/logo/leaguelogo/dark/{{ val.id }}.png" alt="{{ val.name }}">
                    <span>{{ val.name }}</span>
                    <input type="radio" name="league" value="{{ key }}" style="display:none" {% if loop.first %}checked{% endif %}>
                </label>
                {% endfor %}
            </div>
            <div style="margin-bottom: 20px;">
                <select name="season" style="width:100%; padding:10px 16px; border-radius:10px; background:var(--glass-bg); border:1px solid var(--glass-border); color:var(--text-primary); font-family:'Inter',sans-serif; font-size:0.95em;">
                    {% for s in seasons %}
                    <option value="{{ s }}">{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-primary" formaction="{{ url_for('fm_standings') }}">
                    <i class="fas fa-list-ol"></i> Standings
                </button>
                <button type="submit" class="btn btn-outline" formaction="{{ url_for('fm_topscorers') }}">
                    <i class="fas fa-futbol"></i> Top Scorers
                </button>
                <button type="submit" class="btn btn-outline" formaction="{{ url_for('fm_topassists') }}">
                    <i class="fas fa-hands-helping"></i> Top Assists
                </button>
                <button type="submit" class="btn btn-outline" formaction="{{ url_for('fm_topga') }}">
                    <i class="fas fa-chart-line"></i> G+A
                </button>
            </div>
        </form>
    </div>
</div>
<script>
document.querySelectorAll('.league-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.league-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    });
});
document.querySelector('.league-btn').classList.add('selected');
</script>
{% endblock %}
